[project]
name = "fsai-agents"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "langgraph",
    "pydantic",
    "python-dotenv",
    "langchain-ollama",
    "langchain-anthropic",
    "langchain-openrouter",
    "langfuse",
]

[project.optional-dependencies]
dev = ["ruff", "pytest"]
ingestion = ["docling", "llama-parse", "psycopg[binary]", "pgvector"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F",   # pycodestyle errors, pyflakes (unused imports, undefined names)
    "I",        # import sorting
    "B",        # likely bugs
    "UP",       # outdated syntax
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]