[project.optional-dependencies]
dev = ["ruff", "pytest"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F",   # pycodestyle errors, pyflakes (unused imports, undefined names)
    "I",        # import sorting
    "B",        # likely bugs
    "UP",       # outdated syntax
]
